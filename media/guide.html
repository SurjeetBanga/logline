<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{CSP_SOURCE}}; script-src 'nonce-{{NONCE}}';"
    />
    <link rel="stylesheet" href="{{STYLE_URI}}" />
    <title>Logline Guide</title>
  </head>
  <body>
    <nav class="sidebar" aria-label="Guide">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"
          ><svg width="100%" height="100%" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="guide-c" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0f172a" />
                <stop offset="1" stop-color="#020617" />
              </linearGradient>
              <linearGradient id="guide-cs" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff26" />
                <stop offset="0.55" stop-color="#ffffff00" />
              </linearGradient>
              <linearGradient id="guide-cg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#22d3ee" />
                <stop offset="1" stop-color="#a78bfa" />
              </linearGradient>
            </defs>
            <rect width="128" height="128" rx="30" fill="url(#guide-c)" />
            <rect width="128" height="128" rx="30" fill="url(#guide-cs)" />
            <g fill="none" stroke="url(#guide-cg)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
              <path d="M44 30c-9 0-11 5-11 12v10c0 7-3 12-11 12 8 0 11 5 11 12v10c0 7 2 12 11 12" />
              <path d="M84 30c9 0 11 5 11 12v10c0 7 3 12 11 12-8 0-11 5-11 12v10c0 7-2 12-11 12" />
            </g>
            <circle cx="48" cy="64" r="6.5" fill="#e0f2fe" />
            <circle cx="64" cy="64" r="6.5" fill="#e0f2fe" />
            <circle cx="80" cy="64" r="6.5" fill="#f472b6" /></svg
        ></span>
        <span class="brand-text"><strong>Logline Guide</strong><span id="guideVersion"></span></span>
      </div>
      <label class="guide-search">
        <span class="visually-hidden">Search the guide</span>
        <svg
          aria-hidden="true"
          viewBox="0 0 16 16"
          width="13"
          height="13"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        >
          <circle cx="7" cy="7" r="4.5" />
          <path d="M10.5 10.5 14 14" />
        </svg>
        <input id="guideSearch" type="search" placeholder="Search the guide" autocomplete="off" />
      </label>
      <div id="guideNav" class="guide-nav"></div>
      <button id="whatsNewTab" class="whats-new-link" type="button" data-section="whatsNew">
        <svg
          aria-hidden="true"
          viewBox="0 0 16 16"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linejoin="round"
        >
          <path d="M8 2l1.4 4.6L14 8l-4.6 1.4L8 14l-1.4-4.6L2 8l4.6-1.4z" />
        </svg>
        <span>What’s new</span><span id="whatsNewCount" class="count" hidden></span>
      </button>
    </nav>
    <main>
      <section id="guideSection" aria-labelledby="startTitle">
        <div id="start" class="guide-group">
          <h1 id="startTitle" tabindex="-1">Get started</h1>
          <p class="summary">
            Three steps from a terminal to an agent that reads your logs. Each one ticks off when you do it.
          </p>
          <ol id="startSteps" class="steps"></ol>
          <p class="tour-line">
            New to the panel?
            <button id="takeTour" class="link" type="button">Take the 1-minute tour of the Logs panel</button>
          </p>
        </div>
        <div id="guideCards"></div>
        <div id="keys" class="guide-group">
          <h2 tabindex="-1">Keyboard</h2>
          <dl id="keyList" class="keys"></dl>
        </div>
        <p id="noResults" class="summary" hidden>Nothing in the guide matches. Try a shorter word.</p>
      </section>
      <section id="whatsNewSection" aria-labelledby="whatsNewTitle" hidden>
        <p class="eyebrow" id="whatsNewEyebrow">Release highlights</p>
        <h1 id="whatsNewTitle" tabindex="-1">What’s new in Logline</h1>
        <div id="releaseList" class="release-list" aria-live="polite"></div>
        <button id="openChangelog" class="secondary" type="button">Full changelog, with every fix</button>
      </section>
    </main>
    <script nonce="{{NONCE}}">
      window.__LOGLINE_GUIDE__ = {{GUIDE_JSON}};
    </script>
    <script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>
  </body>
</html>
