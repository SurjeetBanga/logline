<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}}; script-src 'nonce-{{NONCE}}';">
  <link rel="stylesheet" href="{{STYLE_URI}}">
  <title>Logs</title>
</head>
<body>
  <header>
    <div class="toolbar">
      <select id="server" aria-label="Server"><option value="">All servers</option></select>
      <button id="run">Run selected</button>
      <input id="search" type="search" placeholder="Search retained logs…" aria-label="Search retained logs" maxlength="256">
      <select id="level" aria-label="Minimum log level">
        <option value="trace">All levels</option><option value="debug">Debug+</option>
        <option value="info">Info+</option><option value="warn">Warn+</option>
        <option value="error">Error+</option><option value="fatal">Fatal</option>
      </select>
      <button id="follow" aria-pressed="true">Live</button>
      <button id="config">⚙ Config</button><button id="manage">Manage servers</button>
      <button id="clear">Clear</button><button id="stop" disabled>Stop all</button>
    </div>
    <div class="session"><span id="status">Ready</span><code id="command"></code></div>
  </header>
  <section class="table-scroll" aria-label="Log events">
    <table>
      <colgroup><col class="time-col"><col class="level-col"><col><col class="source-col"></colgroup>
      <thead><tr id="head-row"><th>Time</th><th>Level</th><th>Message · click to expand</th><th>Source</th></tr></thead>
      <tbody id="logs"></tbody>
    </table>
    <p id="empty">Run a server command to see its logs here.</p>
  </section>
  <footer>
    <div class="pagination"><button id="older">← Older</button><span id="page">Page 1 of 1</span><button id="newer">Newer →</button><span id="mode">Live</span></div>
    <div id="counts" role="status">0 received · 0 retained · 0 discarded</div>
  </footer>
  <script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>
</body>
</html>
