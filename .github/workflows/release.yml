name: Release

# Pushing a tag such as v1.14.1 releases that commit. The tag must match package.json, CHANGELOG.md must have a section
# for the version, and the commit must be on main. The whole of CI then runs on it, and the VSIX it builds and tests is
# the one published, after approval, to the VS Code Marketplace and Open VSX, then attached to a GitHub release.
#
# No stored token publishes to the Marketplace: the publish job signs in to Azure as a managed identity federated with
# the `release` environment, which only `v*` tags reach and which waits for a reviewer. Open VSX uses trusted
# publishing the same way; until it is registered (it needs one published version), it uses the `OVSX_PAT` secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag, the version, the changelog, and main
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$version" ] || { echo "::error::Tag $TAG does not match package.json version $version."; exit 1; }
          grep -Eq "^## $version — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $version — YYYY-MM-DD' section."; exit 1; }
          ! grep -q '^## Unreleased' CHANGELOG.md || { echo "::error::CHANGELOG.md still has an Unreleased section."; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main: release only commits that passed CI there."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The same checks as every pull request, on the tagged commit; its build job uploads the VSIX published below.
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    # A called workflow can only use permissions its caller grants. Its comment job (pull requests only, so it does
    # not run here) asks to write pull request comments.
    permissions:
      contents: read
      pull-requests: write

  publish:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # vsce and ovsx from the lockfile, with no install scripts: nothing else runs beside the publishing credentials.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: logline-vsix
          path: vsix
      - name: Check the VSIX is this version
        run: test -f "vsix/logline-${{ needs.verify.outputs.version }}.vsix"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # --skip-duplicate: rerunning the job after one store failed finishes the other.
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --packagePath vsix/*.vsix --azure-credential --skip-duplicate
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish --packagePath vsix/*.vsix --skip-duplicate
          else
            unset OVSX_PAT
            npx ovsx publish --packagePath vsix/*.vsix --skip-duplicate --trusted-publishing
          fi

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: logline-vsix
          path: vsix
      - name: Create the GitHub release with the changelog section and the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## " version " ") == 1 { section = 1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" vsix/*.vsix --verify-tag --title "Logline $VERSION" --notes-file notes.md
