name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so advisories published against unchanged dependencies still fail the build.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on any known vulnerability, including dev dependencies
        run: npm audit --audit-level=low
      - name: Verify registry signatures and provenance of installed packages
        run: npm audit signatures

  # Pull requests only: fails when a change adds a dependency with a known vulnerability, before it reaches main.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the generated viewer bundle is up to date
        shell: bash
        run: |
          npm run compile
          git diff --exit-code -- media/ || { echo "::error::media/ is stale; run npm run compile and commit the result."; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm run format:check
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'
      - name: Run the tests with coverage
        if: runner.os == 'Linux'
        run: npm run coverage
      - run: npm run package
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: logline-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

  # Runs the VSIX built above, not this checkout, in the oldest supported VS Code (engines.vscode) and the latest stable.
  smoke:
    name: smoke (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: ['1.99.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile the smoke test entry
        run: npx tsc -p tsconfig.test.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logline-vsix
      - name: Run the packaged extension in VS Code
        shell: bash
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          vsix=$(ls logline-*.vsix)
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/smoke.mjs --vsix "$vsix"; else node scripts/smoke.mjs --vsix "$vsix"; fi

  # The one check branch protection requires, so the matrix above can change without editing repository settings.
  ci-passed:
    name: CI passed
    if: always()
    needs: [audit, dependency-review, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        # Dependency review runs only on pull requests, so it may be skipped; every other job must succeed.
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ needs.audit.result == 'success' && needs.build.result == 'success' && needs.smoke.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs['dependency-review'].result) }}" = true ]
