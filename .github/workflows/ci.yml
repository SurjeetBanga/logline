name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so advisories published against unchanged dependencies still fail the build.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on any known vulnerability, including dev dependencies
        run: npm audit --audit-level=low
      - name: Verify registry signatures and provenance of installed packages
        run: npm audit signatures

  # Pull requests only: fails when a change adds a dependency with a known vulnerability, before it reaches main.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the generated viewer bundle is up to date
        shell: bash
        run: |
          npm run compile
          git diff --exit-code -- media/ || { echo "::error::media/ is stale; run npm run compile and commit the result."; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm run format:check
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'
      - name: Run the tests with coverage
        if: runner.os == 'Linux'
        run: npm run coverage
      - run: npm run package
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: logline-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

  # Runs the VSIX built above, not this checkout, in the oldest supported VS Code (engines.vscode) and the latest stable.
  smoke:
    name: smoke (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: ['1.99.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile the smoke test entry
        run: npx tsc -p tsconfig.test.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logline-vsix
      - name: Run the packaged extension in VS Code
        shell: bash
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          vsix=$(ls logline-*.vsix)
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/smoke.mjs --vsix "$vsix"; else node scripts/smoke.mjs --vsix "$vsix"; fi

  # The one check branch protection requires, so the matrix above can change without editing repository settings.
  # Compares this build with the one it changes, on the same runner, and fails when a hot path is slower or a
  # payload or retained memory is larger. Scheduled and manual runs have nothing to compare with.
  performance:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Build the base for comparison
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          npm ci
          npm run compile
      - name: Compare performance with the base
        run: node scripts/perf-compare.mjs --base "$RUNNER_TEMP/base" --report performance/report.md --json performance/results.json
      # Kept for every run, including pushes to main, as a history of the numbers.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance
          path: performance/
          if-no-files-found: ignore
          retention-days: 90

  # Posts the performance table on the pull request, and updates the same comment on each push. A job of its own, so
  # the pull request's code never runs with a token that can write; pull requests from forks get no write token.
  performance-comment:
    needs: performance
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.performance.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: performance
      - name: Post or update the performance comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ needs.performance.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- logline-performance -->'
          if [ -f report.md ]; then report=$(cat report.md); else report="## Performance

          The comparison did not finish ($RESULT). See the run for details."; fi
          body=$(printf '%s\n%s\n\n[Run details and results](%s)\n' "$marker" "$report" "$RUN")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null; fi

  ci-passed:
    name: CI passed
    if: always()
    needs: [audit, dependency-review, build, smoke, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        # Dependency review runs only on pull requests, and performance only on pull requests and pushes, so either may
        # be skipped; every other job must succeed.
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ needs.audit.result == 'success' && needs.build.result == 'success' && needs.smoke.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs['dependency-review'].result) && contains(fromJSON('["success", "skipped"]'), needs.performance.result) }}" = true ]
