name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so advisories published against unchanged dependencies still fail the build.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on any known vulnerability, including dev dependencies
        run: npm audit --audit-level=low
      - name: Verify registry signatures and provenance of installed packages
        run: npm audit signatures

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the generated viewer bundle is up to date
        # Linux only: Windows checkouts can convert line endings in the committed bundle.
        if: runner.os == 'Linux'
        run: |
          npm run compile
          git diff --exit-code -- media/ || { echo "::error::media/ is stale; run npm run compile and commit the result."; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm run format:check
        if: runner.os == 'Linux'
      - run: npm test
      - run: npm run package
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: logline-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

  # Runs the VSIX built above, not this checkout, in the oldest supported VS Code (engines.vscode) and the latest stable.
  smoke:
    name: smoke (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: ['1.99.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile the smoke test entry
        run: npx tsc -p tsconfig.test.json
      - uses: actions/download-artifact@v8
        with:
          name: logline-vsix
      - name: Run the packaged extension in VS Code
        shell: bash
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          vsix=$(ls logline-*.vsix)
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/smoke.mjs --vsix "$vsix"; else node scripts/smoke.mjs --vsix "$vsix"; fi

  # The one check branch protection requires, so the matrix above can change without editing repository settings.
  ci-passed:
    name: CI passed
    if: always()
    needs: [audit, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false ]
