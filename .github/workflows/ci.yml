name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so advisories published against unchanged dependencies still fail the build.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on any known vulnerability, including dev dependencies
        run: npm audit --audit-level=low
      - name: Verify registry signatures and provenance of installed packages
        run: npm audit signatures

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the generated viewer bundle is up to date
        run: |
          npm run compile
          git diff --exit-code -- media/ || { echo "::error::media/ is stale; run npm run compile and commit the result."; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: logline-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
