name: Bug report
description: Something in Logline does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem, such as a secret that sharing or export does not redact, belongs in a [private report](https://github.com/SurjeetBanga/logline/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command, task, file, or app you captured, and what you did in Logline.
      placeholder: |
        1. Run `npm start` with Logline: Run Command…
        2. Search for `level:error`
        3. …
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where the logs came from
      multiple: true
      options:
        - A command run with Logline
        - Terminal capture
        - Debug session
        - VS Code task
        - Followed file
        - Imported file
        - OpenTelemetry
        - Docker Compose or Kubernetes
        - Not about capture
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      description: If the problem is about sharing logs with an agent.
      options:
        - None
        - GitHub Copilot
        - Claude Code
        - Codex
        - Another MCP client
  - type: input
    id: version
    attributes:
      label: Logline version
      description: In the Extensions view, or the first line of Copy status.
      placeholder: '1.14.0'
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - VS Code
        - Cursor
        - Windsurf
        - Kiro
        - Other
    validations:
      required: true
  - type: input
    id: editor-version
    attributes:
      label: Editor version
      description: Help → About.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Remote (SSH, WSL, Dev Container, Codespaces)
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Logline status
      description: 'Run **Logline: Show Status**, choose **Copy status**, and paste it here. Check it for anything private first.'
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Example log lines
      description: A few lines that show the problem. Replace tokens, passwords, and personal data with placeholders.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and personal data from everything above.
          required: true
