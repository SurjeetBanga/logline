name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or situation, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you would like Logline to behave.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Capture
        - Search and filters
        - Analysis, traces, or metrics
        - Log statements in the editor
        - Log doctor
        - Sharing with agents
        - Import and export
        - Settings
        - Something else
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds or other tools you use for this.
