<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Compose</title>
    <link rel="stylesheet" href="/compose.css" />
  </head>
  <body>
    <!-- The window screenshot goes in both layouts as #shot, set by the script. -->
    <section id="social" class="social">
      <div class="copy">
        <img class="logo" src="/icon.svg" alt="" />
        <h1>Logline</h1>
        <p class="tagline">
          Logs, traces and AI calls from every run, searchable in VS Code and shared with your AI agent.
        </p>
        <ul class="chips">
          <li>Terminals</li>
          <li>Debug sessions</li>
          <li>OpenTelemetry</li>
          <li>Datadog &amp; SQL</li>
          <li>Claude Code · Codex · Copilot</li>
        </ul>
      </div>
      <img class="window" data-shot alt="" />
    </section>
    <section id="video" class="video">
      <img class="backdrop" data-shot alt="" />
      <div class="veil"></div>
      <div class="copy">
        <div class="brand"><img class="logo" src="/icon.svg" alt="" /><span>Logline</span></div>
        <h1>Logs, traces and AI calls, inside VS Code</h1>
        <p class="sub">A 1-minute tour</p>
      </div>
      <div class="play">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.2v13.6a.6.6 0 0 0 .9.5l11-6.8a.6.6 0 0 0 0-1l-11-6.8a.6.6 0 0 0-.9.5z" />
        </svg>
      </div>
    </section>
  </body>
</html>
